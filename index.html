          <style>* {

          <!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat & Einladungs-Link</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        <div class="chat-box" id="chatBox">
            <!-- Hier erscheinen die Nachrichten -->
        </div>
        <textarea id="message" placeholder="Schreib eine Nachricht..." rows="4" cols="50"></textarea>
        <button id="sendMessage">Nachricht senden</button>
        <button id="generateLink">Link generieren</button>
        <div id="linkContainer">
            <p>Teile diesen Link, um am Chat teilzunehmen: <span id="generatedLink"></span></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>



          <script>// Initialisieren des Chat-Containers und der Nachrichten
let chatBox = document.getElementById('chatBox');
let messageInput = document.getElementById('message');
let generateLinkButton = document.getElementById('generateLink');
let sendMessageButton = document.getElementById('sendMessage');
let generatedLink = document.getElementById('generatedLink');

// Nachrichten im lokalen Speicher speichern (wird beim Laden der Seite abgerufen)
let chatId = new URLSearchParams(window.location.search).get('chatId') || generateChatId();

// Nachrichten anzeigen, wenn die Seite geladen wird
loadMessages(chatId);

// Funktion zum Senden von Nachrichten
sendMessageButton.addEventListener('click', () => {
    let message = messageInput.value.trim();
    if (message) {
        // Nachrichten in den lokalen Speicher speichern
        saveMessage(chatId, message);
        appendMessage(message, 'me');
        messageInput.value = ''; // Nachricht zurücksetzen
    }
});

// Funktion zum Generieren des Links
generateLinkButton.addEventListener('click', () => {
    let link = window.location.href.split('?')[0] + '?chatId=' + chatId;
    generatedLink.textContent = link;
});

// Nachricht speichern
function saveMessage(chatId, message) {
    let messages = JSON.parse(localStorage.getItem(chatId)) || [];
    messages.push({ user: 'me', message: message });
    localStorage.setItem(chatId, JSON.stringify(messages));
}

// Nachrichten laden
function loadMessages(chatId) {
    let messages = JSON.parse(localStorage.getItem(chatId)) || [];
    messages.forEach(msg => appendMessage(msg.message, msg.user));
}

// Nachricht in den Chat einfügen
function appendMessage(message, user) {
    let messageElement = document.createElement('div');
    messageElement.classList.add(user === 'me' ? 'message-me' : 'message-other');
    messageElement.textContent = message;
    chatBox.appendChild(messageElement);
    chatBox.scrollTop = chatBox.scrollHeight; // Scrollen zu neuester Nachricht
}

// Generieren einer neuen Chat-ID, wenn keine in der URL vorhanden ist
function generateChatId() {
    let chatId = 'chat_' + Math.random().toString(36).substr(2, 9);
    return chatId;
}



</script>
        </body>
             <body>
  <h1>Chat-App</h1>

  <div id="chat" style="border: 1px solid #ccc; height: 300px; overflow-y: scroll; padding: 10px; margin-bottom: 10px;">
    <!-- Hier erscheinen Nachrichten und Bilder -->
  </div>

  <input type="text" id="textInput" placeholder="Nachricht schreiben" style="width: 70%;">
  <button onclick="sendText()">Senden</button>
  <br><br>

  <input type="file" id="imageInput" accept="image/*">
  <button onclick="sendImage()">Bild senden</button>

  <script>
    function sendText() {
      const input = document.getElementById("textInput");
      const message = input.value.trim();
      if (message === "") return;

      const chat = document.getElementById("chat");
      const msgDiv = document.createElement("div");
      msgDiv.textContent = message;
      chat.appendChild(msgDiv);

      input.value = "";
      chat.scrollTop = chat.scrollHeight; // Immer nach unten scrollen
    }

    function sendImage() {
      const input = document.getElementById("imageInput");
      const file = input.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = document.createElement("img");
        img.src = e.target.result;
        img.style.maxWidth = "200px";
        img.style.display = "block";
        img.style.margin = "10px 0";

        const chat = document.getElementById("chat");
        chat.appendChild(img);
        chat.scrollTop = chat.scrollHeight;
      };
      reader.readAsDataURL(file);
    }
  </script>
</body>   
        </html>



<body>
  <div id="chat">
    <!-- Nachrichten erscheinen hier -->
  </div>

  <input type="file" id="imageInput" accept="image/*">
  <button onclick="sendImage()">Bild senden</button>

  <script>
    function sendImage() {
      const input = document.getElementById("imageInput");
      const file = input.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = document.createElement("img");
        img.src = e.target.result;
        img.style.maxWidth = "200px"; // Bildgröße im Chat
        img.style.display = "block";
        document.getElementById("chat").appendChild(img);
      };
      reader.readAsDataURL(file);
    }
  </script>
</body>
